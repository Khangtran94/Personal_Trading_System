[project]
name = "signal-bot"
version = "0.1.0"
description = "Binance USDT-M Futures Signal-Only Bot (LONG/SHORT alerts via Telegram)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "websockets>=12.0",
    "pandas-ta>=0.3.14b",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "loguru>=0.7",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
